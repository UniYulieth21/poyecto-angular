<div class="container mt-4">
  <div class="row">
    <div class="col-12">
      <h2 class="text-success mb-4">Lista de Libros</h2>
    </div>
  </div>

  <div class="row">
    <div class="col-md-4 mb-4">
      <app-formulario-libro
        (libroAgregado)="onLibroAgregado($event)"
      ></app-formulario-libro>
    </div>

    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Libros registrados</h5>
          <span class="badge bg-light text-success">{{ (libros$ | async)?.length }}</span>
        </div>
        <div class="card-body p-0">
          <ul class="list-group list-group-flush">
            <li
              *ngFor="let libro of libros$ | async"
              class="list-group-item d-flex justify-content-between align-items-center py-3"
            >
              <div>
                <p class="mb-1 fw-semibold">{{ libro.titulo }}</p>
                <small class="text-muted">{{ libro.autor }}</small>
              </div>
              <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-outline-success" (click)="darVotoPositivo(libro.id)">+1</button>
                <span class="badge bg-primary px-3">{{ libro.votos }}</span>
                <button class="btn btn-sm btn-outline-warning" (click)="darVotoNegativo(libro.id)">-1</button>
                <button class="btn btn-sm btn-danger ms-1" (click)="eliminar(libro.id)">Eliminar</button>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
