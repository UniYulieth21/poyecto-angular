<div class="container">
  <div class="row">
    <div class="col-12">
      <h2 class="mb-4 text-primary">{{ titulo }}</h2>
    </div>
  </div>

  <div class="row">
    <div class="col-md-5 mb-4">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">Agregar nueva tarea</h5>
        </div>
        <div class="card-body">
          <form>
            <div class="mb-3">
              <label class="form-label fw-semibold">Nombre</label>
              <input #nombreInput type="text" class="form-control" placeholder="Nombre de la tarea" />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Descripcion</label>
              <input #descripcionInput type="text" class="form-control" placeholder="Descripcion breve" />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Prioridad</label>
              <select #prioridadInput class="form-select">
                <option value="Alta">Alta</option>
                <option value="Media" selected>Media</option>
                <option value="Baja">Baja</option>
              </select>
            </div>
            <button
              type="submit"
              class="btn btn-primary w-100"
              (click)="agregar(nombreInput, descripcionInput, prioridadInput)"
            >
              Agregar tarea
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-7">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Tareas registradas</h5>
          <span class="badge bg-light text-primary">{{ tareas.length }}</span>
        </div>
        <div class="card-body p-0">
          <ul class="list-group list-group-flush">
            <li
              *ngFor="let tarea of tareas"
              class="list-group-item d-flex justify-content-between align-items-start py-3"
            >
              <div>
                <p class="mb-1 fw-semibold">{{ tarea.nombre }}</p>
                <small class="text-muted">{{ tarea.descripcion }}</small>
              </div>
              <span [class]="'badge rounded-pill bg-' + getPrioridadClase(tarea.prioridad)">
                {{ tarea.prioridad }}
              </span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
