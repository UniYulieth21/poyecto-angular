<div class="card shadow-sm">
  <div class="card-header bg-success text-white">
    <h5 class="mb-0">Agregar nuevo libro</h5>
  </div>
  <div class="card-body">
    <form [formGroup]="formulario" (ngSubmit)="enviar()">

      <div class="mb-3">
        <label class="form-label fw-semibold">Titulo</label>
        <input
          type="text"
          formControlName="titulo"
          class="form-control"
          placeholder="Titulo del libro"
        />
        <div
          *ngIf="formulario.get('titulo')?.hasError('required') && formulario.get('titulo')?.touched"
          class="text-danger small mt-1"
        >
          El titulo es obligatorio.
        </div>
        <div
          *ngIf="formulario.get('titulo')?.hasError('longitudMinima') && formulario.get('titulo')?.touched"
          class="text-danger small mt-1"
        >
          El titulo debe tener al menos
          {{ formulario.get('titulo')?.getError('longitudMinima')?.requerida }}
          caracteres.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Autor</label>
        <input
          type="text"
          formControlName="autor"
          class="form-control"
          placeholder="Nombre del autor"
        />
        <div
          *ngIf="formulario.get('autor')?.hasError('required') && formulario.get('autor')?.touched"
          class="text-danger small mt-1"
        >
          El autor es obligatorio.
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-success w-100"
        [disabled]="formulario.invalid"
      >
        Agregar libro
      </button>
    </form>
  </div>
</div>
